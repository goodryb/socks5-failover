name: release

on:
  push:
    tags:
      - 'v*'      # 打 tag (如 v1.0.0) 时自动构建并发布 Release
  workflow_dispatch: {}   # 支持在 Actions 页面手动触发，只产出 artifacts

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'   # 纯 Go 驱动，静态链接，无需 C 工具链
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          name="socks5-failover-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w" -o "dist/${name}" .
          echo "ARTIFACT=${name}" >> "$GITHUB_ENV"
          sha256sum "dist/${name}" > "dist/${name}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: socks5-failover-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
